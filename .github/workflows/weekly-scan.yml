name: weekly-link-scan

# Every Monday 09:00 US/Eastern (13:00 UTC): re-check every link record
# against the live web and commit the new results.json. The Pages site
# renders the committed file, so the dashboard is always last-scan truth.
on:
  schedule:
    - cron: '0 13 * * 1'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: run link scan
        run: node cli/check.js
      - name: commit results
        run: |
          git config user.name "cwi-link-sentinel[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/results.json
          git diff --cached --quiet || git commit -m "weekly link scan $(date -u +%F)"
          git push
